[project]
name = "shell-emulator"
version = "0.1.0"
description = "Эмулятор командной оболочки UNIX с виртуальной файловой системой"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
line-length = 80

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "ERA", "C90", "PLR", "B", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 7
max-positional-args = 7
max-statements = 30
allow-magic-value-types = ["str", "bytes"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["shell_emulator"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
